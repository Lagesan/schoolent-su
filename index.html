<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Student Council Transparency Portal</title>
  <meta name="description"
    content="A bilingual transparency portal for student council governance, activities, and public reporting." />
  <link rel="icon" type="image/png" href="/assets/schoolent-icon.png" />
  <link rel="stylesheet" href="/styles.css?v=20260815-ui1" />
</head>

<body>
  <a class="skip-link" href="#top">跳至主要内容 / Skip to content</a>
  <div class="page-shell">
    <header class="topbar portal-topbar" id="siteHeader">
      <a class="brand" href="#top" aria-label="Student Council Transparency Portal home">
        <img class="brand-mark" src="/assets/Kunzhong.jpeg" alt="Kunzhong logo" />
        <div>
          <p class="brand-kicker">STUDENT COUNCIL</p>
          <h1 id="brandName">KSC</h1>
        </div>
      </a>
      <button class="menu-toggle" id="menuToggle" type="button" aria-controls="topbarActions" aria-expanded="false">
        <span class="menu-toggle-icon" aria-hidden="true"><span></span><span></span></span>
        <span data-menu-label>导航</span>
      </button>
      <div class="topbar-actions" id="topbarActions">
        <nav class="topnav" aria-label="Primary">
          <a href="#organization" data-nav="organization">架构</a>
          <a href="#activities" data-nav="activities">活动</a>
          <a href="#finance" data-nav="finance">数据</a>
          <a href="#initiatives" data-nav="initiatives">提案</a>
          <a href="#publications" data-nav="publications">纪要</a>
          <a class="download-nav-link" href="/download/" data-nav="download">App 更新</a>
        </nav>
        <div class="lang-switch" role="group" aria-label="Language switcher">
          <button class="lang-pill is-active" type="button" data-lang-trigger="zh">中文</button>
          <button class="lang-pill" type="button" data-lang-trigger="en">EN</button>
        </div>
        <a class="ghost-link" href="/admin/">Admin</a>
      </div>
    </header>

      <main id="top">
        <section class="app-mode-hub" id="appModeHub" hidden></section>

        <section class="hero-grid">
          <div class="hero-copy">
            <p class="section-label" id="heroBadge">CAMPAIGN PLATFORM</p>
          <h2 class="hero-title" id="heroTitle">高效，及时，透明。</h2>
          <p class="hero-subtitle" id="heroSubtitle">组织结构、活动进度与公开信息集中呈现。</p>
          <p class="hero-promise" id="heroPromise"></p>
          <div class="hero-actions">
            <a class="button button-primary" href="#finance" id="primaryAction">透明公开</a>
            <a class="button button-secondary" href="#initiatives" id="secondaryAction">提案跟进</a>
          </div>
        </div>
        <aside class="hero-panel">
          <div class="panel-frame">
            <p class="panel-label" id="siteTagline">正在同步公开记录</p>
            <div class="sync-state" id="syncState" hidden>
              <span data-sync-message role="status" aria-live="polite"></span>
              <button class="sync-retry" type="button" data-sync-retry hidden>重试</button>
            </div>
            <dl class="metric-grid" id="metricGrid" aria-busy="true">
              <div class="metric-item metric-item-loading">
                <dt>PUBLIC RECORD</dt>
                <dd><span class="sync-indicator">SYNCING</span></dd>
              </div>
            </dl>
          </div>
        </aside>
      </section>

      <section class="notice-strip" id="noticeStrip" aria-live="polite" hidden></section>

      <section class="content-section" id="organization">
        <div class="section-header">
          <p class="section-label" id="organizationLabel">STRUCTURE</p>
          <h3 id="organizationHeading"></h3>
        </div>
        <div class="organization-shell" id="organizationChart"></div>
      </section>

      <section class="content-section" id="activities">
        <div class="section-header">
          <p class="section-label" id="activitiesLabel">RECENT ACTIVITY</p>
          <h3 id="activitiesHeading"></h3>
        </div>
        <div class="timeline-list" id="activitiesList"></div>
      </section>

      <section class="content-section" id="finance">
        <div class="section-header">
          <p class="section-label" id="financeLabel">DATA / FINANCE</p>
          <h3 id="financeHeading"></h3>
        </div>
        <div id="financeContainer"></div>
      </section>

      <section class="content-section" id="initiatives">
        <div class="section-header">
          <p class="section-label" id="initiativesLabel">PROPOSAL TRACKER</p>
          <h3 id="initiativesHeading"></h3>
        </div>
        <div class="proposal-grid" id="initiativesGrid"></div>
      </section>

      <section class="content-section" id="publications">
        <div class="section-header">
          <p class="section-label" id="publicationsLabel">PUBLIC NOTES</p>
          <h3 id="publicationsHeading"></h3>
        </div>
        <div class="publication-grid" id="publicationsGrid"></div>
      </section>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>
  </div>

  <a class="back-to-top" id="backToTop" href="#top" aria-label="返回顶部" hidden>
    <span aria-hidden="true">↑</span>
  </a>
  <div class="action-status" id="actionStatus" role="status" aria-live="polite" aria-atomic="true" hidden></div>

  <script type="module" src="/app.js?v=20260815-ui1"></script>
</body>

</html>
